name: Std 7 Data Generator

on:
  schedule:
    # 24 કલાકમાં બરાબર 12 વખત (દર 2 કલાકે એક વાર) ચાલશે
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

jobs:
  generate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Libraries
        run: pip install google-genai

      - name: Run Std 7 AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_qa.py

      - name: Save Generated Data to Database
        run: |
          git config --global user.name "Std7-AI-Bot"
          git config --global user.email "bot@std7data"
          git add .
          git commit -m "Auto-generated daily data" || echo "No changes to commit"
          git push
